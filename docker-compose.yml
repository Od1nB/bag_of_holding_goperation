services:
  db:
    image: postgres:18.0-alpine
    restart: always
    environment:
      - POSTGRES_DB=bagofholding
      - POSTGRES_PASSWORD=pwd
    tmpfs:
          - /var/lib/postgresql/data
    ports:
      - 5432:5432
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:Z,ro
    develop:
      watch:
        - path: './db/'
          action: restart
  
      
